<html>
<head>
  <title>Dikdörtgen Alan Hesaplayıcı</title>
</head>
<body>
    <div>
  <h1>Dikdörtgen Alan Hesaplayıcı</h1>
  <label for="length">Uzunluğu girin: </label>
  <input type="number" id="length"><br><br>

  <label for="width">Genişliği girin: </label>
  <input type="number" id="width"><br><br>

  <button onclick="calculateArea()">Alanı Hesapla</button><br><br>

  <p id="result"></p>
    </div>

    <div>
      <h1>Alışveriş Toplam Hesaplayıcı</h1>

  <input type="number" id="grocery1"><br><br>
  
  <label for="grocery2">İkinci gıda miktarını girin: </label>
  <input type="number" id="grocery2"><br><br>

  <label for="grocery3">Üçüncü gıda miktarını girin: </label>
  <input type="number" id="grocery3"><br><br>

  <button onclick="groceryTracker()">Miktarı Hesapla</button><br><br>

  <p id="total"></p>
    </div>

<script src="./calculate_Area.js"></script>
</body>
</html>
